<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Logbook</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { color: #bb86fc; text-align: center; margin-bottom: 30px; }
        .diary-entry {
            background-color: #1d1d1d;
            border-left: 4px solid #bb86fc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .date { color: #03dac6; font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 8px; }
        textarea {
            width: 100%; height: 100px; background-color: #252525; color: white;
            border: 1px solid #333; padding: 10px; box-sizing: border-box;
            border-radius: 4px; resize: vertical; margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>📓 My Fresh Start Diary</h1>
    <div class="diary-entry">
        <span class="date">📝 SCRATCHPAD</span>
        <textarea placeholder="Type today's thoughts here..."></textarea>
    </div>
    <div class="diary-entry">
        <span class="date">OCTOBER 18, 2026</span>
        <h3>Successfully Launched!</h3>
        <p>Started fresh with a brand new repository and successfully built my ad-free personal diary page.</p>
    </div>
</body>
</html>
